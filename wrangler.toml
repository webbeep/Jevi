name = "jev"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Cloudflare Workers AI: keyless last-resort language model when every keyed provider is down.
[ai]
binding = "AI"

# Workers Paid (active 2026-10-08): CPU per request. Paid default is 30,000 ms; set explicitly so the 10 ms Free cap can't come back silently.
[limits]
cpu_ms = 30000

# zo2-db (D1): G users/sessions/usage/saves, AI neuron budget, search cache. One block only; migrations 0001–0005 share it.
[[d1_databases]]
binding = "DB"
database_name = "zo2-db"
database_id = "844612c9-4b38-469f-b14a-93d841e1dfa9"
migrations_dir = "migrations"

# Engine skip flags (payment/quota/unavailable), short TTL, shared across isolates.
[[kv_namespaces]]
binding = "ENGINE_SKIP"
id = "a36aaa21669444bcb00505c45d7a1c21"
